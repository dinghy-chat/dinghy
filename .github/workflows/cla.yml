name: CLA

# Asks a first-time contributor to sign CLA.md by a comment on the pull request, and stores the
# signatures in the cla-signatures branch. A tiny job: it checks out no code, and a comment that is
# not a signature skips it, which uses no minutes.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}

jobs:
  cla:
    # The owner and bots never sign, so their pull requests skip the job.
    if: >-
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.user.login != 'jcoulaud' &&
        github.event.pull_request.user.type != 'Bot') ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Runs with write access, so it must never check out or run the pull request's code.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/dinghy-chat/dinghy/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # The repository's owner and bots never sign.
          allowlist: ${{ github.repository_owner }},jcoulaud,*[bot]
          lock-pullrequest-aftermerge: false
