name: Image check

# The image on amd64 only, and only when a change can break it, so it costs few minutes. The Image
# workflow builds both platforms on a release tag; this catches a broken image before the merge.
on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "bun.lock"
      - "apps/**"
      - "packages/**"
      - "ee/**"
      - "scripts/image-check.sh"
      - ".github/workflows/image-pr.yml"

permissions:
  contents: read

concurrency:
  group: image-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The bot's release pull request changes only version numbers and the changelog.
    if: github.head_ref != 'release' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ vars.RUNNER_PR || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: docker buildx build --platform linux/amd64 --load --tag dinghy:check .
      - run: scripts/image-check.sh dinghy:check linux/amd64
