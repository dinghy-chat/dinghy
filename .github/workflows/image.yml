name: Image

# Emulated arm64 builds use the most minutes, so this runs on tags and by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The pull request suite on the tagged commit itself, because the commit a squash merge makes on main
  # never ran it, and a tag can point anywhere.
  test:
    uses: ./.github/workflows/ci.yml

  check:
    needs: test
    runs-on: ${{ vars.RUNNER_NIGHTLY || 'ubuntu-24.04' }}
    timeout-minutes: 55
    permissions:
      contents: read
      # Pulls the previous releases, and pushes this image once its checks pass.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The tags, for the latest release.
          fetch-depth: 0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: docker buildx build --platform "${{ matrix.platform }}" --load --tag dinghy:check .
      # Fails on a high or critical problem that has a fix, so a scan cannot block on what nobody can fix.
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/grype:v0.121.2@sha256:6a36234da13f9faa327306ac0b3dab3405cfa2b4eb20c8f904125a8707863913 dinghy:check --only-fixed --fail-on high
      - run: scripts/image-check.sh dinghy:check "${{ matrix.platform }}"
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - if: matrix.platform == 'linux/amd64'
        run: scripts/install-check.sh dinghy:check
      # Backup, restore, and the upgrade from the first and the latest release, which self-hosters run.
      - if: matrix.platform == 'linux/amd64'
        run: scripts/backup-check.sh dinghy:check $(scripts/previous-releases.sh)
      # The image these checks ran on, not a second build. The publish job joins the two.
      - if: env.RELEASE == 'true'
        run: |
          arch="${{ matrix.platform }}"
          target="ghcr.io/dinghy-chat/dinghy:${GITHUB_REF_NAME#v}-${arch#linux/}"
          docker tag dinghy:check "$target"
          docker push "$target"

  # A release tag such as v0.1.0, after both architectures pass. The package is private while the
  # repository is.
  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ${{ vars.RUNNER_PR || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          image="ghcr.io/dinghy-chat/dinghy:${GITHUB_REF_NAME#v}"
          docker buildx imagetools create --tag "$image" "$image-amd64" "$image-arm64"
          docker buildx imagetools inspect "$image"
