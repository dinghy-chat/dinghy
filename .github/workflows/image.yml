name: Image

# Emulated arm64 builds use the most minutes, so this runs on tags and by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The pull request suite on the tagged commit itself, because the commit a squash merge makes on main
  # never ran it, and a tag can point anywhere.
  test:
    uses: ./.github/workflows/ci.yml

  check:
    needs: test
    runs-on: ${{ vars.RUNNER_NIGHTLY || 'ubuntu-24.04' }}
    timeout-minutes: 55
    permissions:
      contents: read
      # Pushes this image once its checks pass.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The tags, for the latest release.
          fetch-depth: 0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: docker buildx build --platform "${{ matrix.platform }}" --load --tag dinghy:check .
      # Fails on a high or critical problem that has a fix, so a scan cannot block on what nobody can fix.
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/grype:v0.121.2@sha256:6a36234da13f9faa327306ac0b3dab3405cfa2b4eb20c8f904125a8707863913 dinghy:check --only-fixed --fail-on high
      - run: scripts/image-check.sh dinghy:check "${{ matrix.platform }}"
      - if: matrix.platform == 'linux/amd64'
        run: scripts/install-check.sh dinghy:check
      # Backup, restore, and the upgrade from the first and the latest release, which self-hosters run.
      - if: matrix.platform == 'linux/amd64'
        run: scripts/backup-check.sh dinghy:check $(scripts/previous-releases.sh)
      # The image these checks ran on, not a second build. The publish job joins the two.
      - if: env.RELEASE == 'true'
        run: |
          arch="${{ matrix.platform }}"
          target="ghcr.io/dinghy-chat/dinghy:${GITHUB_REF_NAME#v}-${arch#linux/}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag dinghy:check "$target"
          docker push "$target"

  # A release tag such as v0.1.0, after both architectures pass.
  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ${{ vars.RUNNER_PR || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          image="ghcr.io/dinghy-chat/dinghy:${GITHUB_REF_NAME#v}"
          docker buildx imagetools create --tag "$image" "$image-amd64" "$image-arm64"
          docker buildx imagetools inspect "$image"

  # The GitHub Release, with the version's section of CHANGELOG.md as its notes. Watchers of the
  # repository's releases get a notice.
  github-release:
    needs: publish
    runs-on: ${{ vars.RUNNER_PR || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## /{on=0} on' CHANGELOG.md > notes.md
          printf '\nImage: `ghcr.io/dinghy-chat/dinghy:%s`\n' "$version" >> notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Dinghy $version" --notes-file notes.md

  # Starts the Deploy workflow of the private dinghy-internal repository, which puts the release on
  # Dinghy Cloud. It needs the dinghy-chat-release GitHub App, which a fork does not have.
  deploy-cloud:
    needs: publish
    if: github.repository == 'dinghy-chat/dinghy'
    runs-on: ${{ vars.RUNNER_PR || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: dinghy-chat
          repositories: dinghy-internal
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api repos/dinghy-chat/dinghy-internal/dispatches -f event_type=deploy -f "client_payload[version]=${GITHUB_REF_NAME#v}"
