name: Nightly

# The full browser suite, only when the code changed. Start it by hand before merging a change to
# the widget. Scheduled jobs share the free allowance with pull requests, so keep this one short.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ${{ vars.RUNNER_PR || 'ubuntu-24.04' }}
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Compares with the last nightly that passed, not with a clock window: GitHub starts a scheduled
      # run hours late at times, and a window would then skip the commits between two runs.
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # If GitHub cannot answer, it runs everything rather than skip.
          last="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow Nightly --branch main --status success -L 1 --json headSha --jq '.[0].headSha // empty' || true)"
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2>/dev/null ||
            ! git diff --quiet "$last" HEAD -- apps packages ee tests compose.yaml Dockerfile scripts install.sh playwright.config.ts bun.lock; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
  e2e:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ${{ vars.RUNNER_NIGHTLY || 'ubuntu-24.04' }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 15
      valkey:
        image: valkey/valkey:9-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
        ports:
          - 56379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium firefox webkit
      # Chromium runs every file. Firefox and WebKit run the widget-facing ones (playwright.config.ts).
      - run: bun x playwright test

  install:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ${{ vars.RUNNER_NIGHTLY || 'ubuntu-24.04' }}
    timeout-minutes: 50
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The tags, for the latest release.
          fetch-depth: 0
      - run: docker build --tag dinghy:check .
      # Fails on a high or critical problem that has a fix, so a scan cannot block on what nobody can fix.
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/grype:v0.121.2@sha256:6a36234da13f9faa327306ac0b3dab3405cfa2b4eb20c8f904125a8707863913 dinghy:check --only-fixed --fail-on high
      - run: scripts/image-check.sh dinghy:check
      - run: scripts/installer-check.sh dinghy:check
      - run: scripts/install-check.sh dinghy:check
      # The previous releases are private until launch, so this logs in only to pull them.
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # Upgrades from the first release, and from the latest one, which is what installs upgrade from.
      - run: scripts/backup-check.sh dinghy:check $(scripts/previous-releases.sh)
      - run: scripts/upgrade-check.sh dinghy:check
      # The full stack under a 4 GB limit.
      - run: scripts/capacity-check.sh dinghy:check 1000 20 60 1

  # A red scheduled run is easy to miss, so a failure opens an issue, or comments on the open one, and
  # the next green run closes it. GitHub then notifies the repository's watchers.
  report:
    needs: [changes, e2e, install]
    if: always() && needs.changes.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.RUNNER_PR || 'ubuntu-24.04' }}
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULTS: "e2e: ${{ needs.e2e.result }}, install: ${{ needs.install.result }}"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          title="The nightly run failed"
          open="$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)"
          if [ "$FAILED" = "true" ]; then
            body="$RESULTS. A cancelled job hit its time limit. $RUN"
            if [ -n "$open" ]; then gh issue comment "$open" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Green again: $RUN"
          fi
