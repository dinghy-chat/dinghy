name: Site

# CI skips a pull request that changes only site/ or docs/, so the site's own tests run here. They need
# no database, so this job is short. Pull request jobs must fit GitHub's free allowance of about
# 2,000 minutes a month. Ask the maintainers before adding a job or a paid runner.
# A merge to main that changes site/ deploys dinghy.chat, after the same tests pass.
on:
  pull_request:
    paths:
      - "site/**"
      # The docs pages are built from these, and the tests fail when the two drift apart.
      - "docs/*.md"
      - "docs/media/**"
      - "compose.yaml"
      - "tests/site.test.ts"
      - "vitest.site.config.ts"
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ${{ vars.RUNNER_PR || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun x vitest run --config vitest.site.config.ts

  deploy:
    needs: site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.RUNNER_PR || 'ubuntu-24.04' }}
    timeout-minutes: 5
    # One deploy at a time, and never cancelled halfway.
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # The token may edit only the dinghy-site Worker. A version upload and deploy leave the
      # dinghy.chat custom domain as it is, which a plain `wrangler deploy` would need more rights for.
      - name: Upload and deploy a new version
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          version=$(bun x wrangler@4.158.0 versions upload | sed -n 's/.*Version ID: \([0-9a-f-]*\).*/\1/p')
          test -n "$version"
          bun x wrangler@4.158.0 versions deploy "$version@100%" --yes
